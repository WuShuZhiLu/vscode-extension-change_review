name: Release

# 打 tag 即发版：自动打包 vsix + 源码包，并作为 Release 资产上传（Gitea Actions）。
# 版本号以 package.json 为准，且必须与 tag 一致（tag 可写 v0.5.0-pre 或 0.5.0-pre）。
#
# 前置条件：
#   1. 仓库已启用 Actions（仓库 → 设置 → 高级/仓库设置里打开 Actions），并注册了 runner；
#   2. runner 镜像里要有 Node.js >= 18（脚本用了内置 fetch 调 API）；
#      若镜像里没有，把下面的「准备 Node.js」一步换成 actions/setup-node@v4。
#   GITHUB_TOKEN 由 Gitea 自动注入，无需手工配置 secret。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: http://gitea_latest:3000/actions/checkout@v4

      - name: 准备 Node.js
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "runner 镜像里没有 node。请给 runner 装 Node.js >= 18，或把这一步换成 actions/setup-node@v4"
            exit 1
          fi
          node -v

      - name: 准备 SVN 命令行工具（可选）
        # 缺 svn/svnadmin 时 vcscheck 会自动跳过 SVN 相关段（不判失败），
        # 这里只是尽力装上，让有条件的 runner 真正跑一遍 SVN provider。
        run: |
          if command -v svn >/dev/null 2>&1 && command -v svnadmin >/dev/null 2>&1; then
            echo "已存在 svn / svnadmin"
          elif command -v apt-get >/dev/null 2>&1; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq subversion) || echo "未装上 subversion，vcscheck 将跳过 SVN 段"
          else
            echo "无 apt-get，vcscheck 将跳过 SVN 段"
          fi

      - name: 跑测试（打包前先确认没坏）
        run: |
          node tools/selfcheck.js
          node tools/mockcheck.js
          node tools/vcscheck.js

      - name: 打包并发布（vsix + 源码包）
        run: node tools/release.js --upload
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          # runner 与 Gitea 同处一个 docker 网络，直接用 Gitea 注入的 api_url
          # （http://gitea_latest:3000/api/v1）。地址一律不写进本文件（会同步到公开仓库）。
          RELEASE_API_URL: ${{ github.api_url }}
